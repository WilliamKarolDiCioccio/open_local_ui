name: open_local_ui

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  adaptive_theme: ^3.7.2
  animated_splash_screen: ^1.3.0
  archive: ^4.0.7
  audioplayers: ^6.5.1
  battery_plus: ^7.0.0
  bitsdojo_window: ^0.1.6
  cached_network_image: ^3.4.1
  discord_rpc: ^0.0.2
  duckduckgo_search: ^0.2.0
  envied: ^1.3.2
  feedback: ^3.2.0
  file_picker: ^10.3.8
  file_selector: ^1.1.0
  flex_color_picker: ^3.8.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_form_builder: ^10.2.0
  flutter_highlight: ^0.7.0
  flutter_localization: ^0.3.3
  flutter_sticky_widgets: ^0.0.3
  flutter_svg: ^2.2.3
  form_builder_validators: ^11.2.0
  freezed_annotation: ^2.4.1
  get_it: ^9.2.0
  hive_flutter: ^1.1.0
  html: ^0.15.6
  http: ^1.6.0
  image: ^4.7.2
  indexed: ^0.0.8
  intl: ^0.20.2
  introduction_screen: ^4.0.0
  json_annotation: ^4.9.0
  langchain: ^0.7.9
  langchain_ollama: ^0.3.1
  language_code: ^0.5.5
  logger: ^2.6.2
  markdown: ^7.3.0
  markdown_widget: ^2.3.2+8
  package_info_plus: ^9.0.0
  page_transition: ^2.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  rive: ^0.14.1
  shared_preferences: ^2.5.4
  smooth_scroll_multiplatform: ^1.0.8
  sqlite3: ^3.1.4
  sqlite3_flutter_libs: ^0.5.41
  supabase_flutter: ^2.12.0
  super_drag_and_drop: ^0.9.1
  system_info2: ^4.1.0
  system_theme: ^3.2.0
  timelines_plus: ^1.0.8
  unicons: ^3.0.0
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  visibility_detector: ^0.4.0+2
  win32_registry: ^2.1.0
  windows_taskbar: ^1.1.2
  rust_lib_open_local_ui:
    path: rust_builder
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  freezed: ^2.5.2
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  test_coverage_badge: ^0.3.2
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1
  envied_generator: ^1.1.1
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.13
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  assets:
    # Prompts
    - assets/prompts/default.txt
    - assets/prompts/sessions_title_generator.txt
    # App metadata
    - assets/app_changelog.json
    # Logos
    - assets/graphics/logos/
    # Animations
    - assets/graphics/animations/gpu.riv
    - assets/graphics/animations/human.riv
  fonts:
    - family: ValeraRound
      fonts:
        - asset: assets/fonts/VarelaRound/VarelaRound-Regular.ttf
          style: normal
    - family: Neuton
      fonts:
        - asset: assets/fonts/Neuton/Neuton-Regular.ttf
          style: normal
        - asset: assets/fonts/Neuton/Neuton-Italic.ttf
          style: italic
        - asset: assets/fonts/Neuton/Neuton-Light.ttf
          weight: 300
        - asset: assets/fonts/Neuton/Neuton-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Neuton/Neuton-Bold.ttf
          weight: 700
        - asset: assets/fonts/Neuton/Neuton-ExtraBold.ttf
          weight: 800
    - family: Agave
      fonts:
        - asset: assets/fonts/Agave/AgaveNerdFontMono-Regular.ttf
          style: normal
        - asset: assets/fonts/Agave/AgaveNerdFontMono-Bold.ttf
          weight: 400
  uses-material-design: true
